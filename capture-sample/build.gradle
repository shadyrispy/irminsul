plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.esc.irminsul.sample'
    compileSdk 35

    defaultConfig {
        applicationId "com.esc.irminsul.sample"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}

dependencies {
    // Resolved from mavenLocal after `./gradlew :capture:publishToMavenLocal`,
    // i.e. this app consumes the library exactly like a third-party host would.
    implementation 'com.esc.irminsul:capture:1.1.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
