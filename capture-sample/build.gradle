plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.esc.irminsul.sample'
    compileSdk 35

    defaultConfig {
        applicationId "com.esc.irminsul.sample"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}

configurations.all {
    // Always resolve the freshly published artifact, never a cached copy.
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

dependencies {
    // Resolved from mavenLocal, i.e. this app consumes the library exactly like
    // a third-party host would — no project() shortcut.
    implementation('com.esc.irminsul:capture:1.6.0') { changing = true }
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

// Publishing is part of this module's build: the point of the sample is to
// prove the AAR, not the source project, carries the capture stack.
tasks.named('preBuild') {
    dependsOn ':capture:publishToMavenLocal'
}
