org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.internal.platform.cgroup.disable=true
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=35
# The one shipped version. The AAR's artifact version, the sample's dependency on it,
# and the host app's versionName/versionCode all read this line, so a release cannot
# be numbered two ways — which is what the CI step that stamped the APK from
# irminsul-core's Cargo.toml used to do.
#
# Bump it when the capture seam moves: a new public type or member is a minor, a
# behaviour fix is a patch. The Rust crates keep their own versions; those are
# internal facts and nothing a host installs is numbered from them.
captureVersion=1.11.0
