plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.esc.irminsul.capture'
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 21

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }

    // C capture core: VPN packet loop + zdtun flow tracking (libcapture.so).
    externalNativeBuild {
        cmake {
            path file("src/main/c/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs 'src/main/jniLibs'
            }
        }
    }

    // Rust decrypt/parse stack (libirminsul.so) built from this module's rust/.
    task buildRustLibs(type: Exec) {
        workingDir "${projectDir}/rust/irminsul-jni"
        // Declare inputs so Gradle re-runs cargo when sources change; without
        // this the task stays UP-TO-DATE forever once jniLibs exists.
        inputs.dir "${projectDir}/rust/irminsul-jni/src"
        inputs.file "${projectDir}/rust/irminsul-jni/Cargo.toml"
        inputs.file "${projectDir}/rust/irminsul-jni/Cargo.lock"
        inputs.dir "${projectDir}/rust/irminsul-core/src"
        inputs.file "${projectDir}/rust/irminsul-core/Cargo.toml"
        inputs.file "${projectDir}/rust/irminsul-core/build.rs"
        // Respect the inherited PATH (e.g. injected by `mise exec` or a
        // cargo-ndk shim) and only fall back to ~/.cargo/bin as a safety net,
        // so mise-managed toolchains take priority over a local ~/.cargo.
        def cargoDir = "${System.getenv('HOME')}/.cargo/bin"
        def basePath = System.getenv('PATH') ?: ''
        def newPath = basePath.contains(cargoDir) ? basePath : "${basePath}:${cargoDir}"
        environment 'PATH', newPath
        // NOTE: whitespace separated, no quoting support (values must not contain spaces)
        def extraArgs = (System.getenv('CARGO_EXTRA_ARGS') ?: '')
                .trim().split("\\s+").findAll { it }
        // Gradle's Exec resolves the executable against the daemon's PATH, not
        // the child environment set below — use the absolute path when present.
        def homeCargo = "${System.getenv('HOME')}/.cargo/bin/cargo"
        def cargoExe = file(homeCargo).exists() ? homeCargo : 'cargo'
        commandLine cargoExe, 'ndk',
                '-t', 'arm64-v8a',
                '-o', "${projectDir}/src/main/jniLibs",
                'build',
                '--release',
                '--lib',
                *extraArgs

        // Declare the produced native libs so Gradle treats src/main/jniLibs as
        // a real task output. Without this, AGP's merge/package tasks cache the
        // previously packaged .so and never refresh the APK when buildRustLibs
        // rewrites it.
        outputs.dir "${projectDir}/src/main/jniLibs"
    }

    preBuild.dependsOn buildRustLibs
}

// The shipped native libraries are part of this module's interface: Kotlin
// declares each `external fun` by package + class name while C and Rust export
// it by literal name. A one-sided rename compiles, links, and then fails at
// runtime with UnsatisfiedLinkError, so assert the pair on every build.
def nativeSymbols = [
    'libirminsul.so': [
        'Java_com_esc_irminsul_capture_internal_NativeLib_nativeInitLogging',
        'Java_com_esc_irminsul_capture_internal_NativeLib_nativeCreateSniffer',
        'Java_com_esc_irminsul_capture_internal_NativeLib_nativeProcessPacket',
        'Java_com_esc_irminsul_capture_internal_NativeLib_nativeCommandBody',
        'Java_com_esc_irminsul_capture_internal_NativeLib_nativeExportGood',
        'Java_com_esc_irminsul_capture_internal_NativeLib_nativeExportAchievements',
        'Java_com_esc_irminsul_capture_internal_NativeLib_nativeDestroySniffer',
    ],
    'libcapture.so': [
        'Java_com_esc_irminsul_capture_internal_CaptureService_nativeRunPacketLoop',
        'Java_com_esc_irminsul_capture_internal_CaptureService_nativeStopCapture',
        'Java_com_esc_irminsul_capture_internal_CaptureService_nativeSetDnsServer',
    ],
]

def nmHost = System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64'
    : (System.getProperty('os.name').toLowerCase().contains('windows') ? 'windows-x86_64' : 'linux-x86_64')

tasks.register('verifyNativeSymbols') {
    group = 'verification'
    description = 'Checks that every JNI symbol Kotlin declares is exported by the matching .so.'
    def merged = layout.buildDirectory.dir('intermediates/merged_native_libs/debug/out/lib/arm64-v8a')
    def nmTool = file("${android.ndkDirectory}/toolchains/llvm/prebuilt/${nmHost}/bin/llvm-nm")
    inputs.dir(merged)
    doLast {
        def problems = []
        nativeSymbols.each { lib, symbols ->
            def so = new File(merged.get().asFile, lib)
            if (!so.exists()) {
                problems << "expected $lib in the merged native libs but it is absent"
                return
            }
            def out = providers.exec {
                commandLine nmTool.absolutePath, '-g', '--defined-only', so.absolutePath
            }.standardOutput.asText.get()
            symbols.each { sym ->
                if (!out.contains(sym)) problems << "$lib does not export $sym"
            }
        }
        if (problems) {
            throw new GradleException(
                "Native symbol check failed — a Kotlin/native rename was not done in lockstep:\n  " +
                    problems.join("\n  ")
            )
        }
        logger.lifecycle("Native symbols verified: ${nativeSymbols.values().sum { it.size() }} exports in ${nativeSymbols.size()} libs")
    }
}

// Variant tasks are created after evaluation, so match by name instead of
// resolving them eagerly.
tasks.matching { it.name == 'assembleDebug' }.configureEach {
    finalizedBy 'verifyNativeSymbols'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

// Publish as `com.esc.irminsul:capture:<version>`; `./gradlew :capture:publishToMavenLocal`
// (or :capture:publishReleasePublicationTo<repo>) produces an AAR that already
// carries both native libraries, the VPN service and the permissions.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.esc.irminsul'
                artifactId = 'capture'
                version = '1.2.0'
                pom {
                    name = 'Irminsul Capture'
                    description = 'Genshin packet capture, decryption and protobuf ' +
                            'command decoding as an embeddable Android library.'
                }
            }
        }
    }
}
