plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.esc.irminsul.capture'
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 21

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }

    // C capture core: VPN packet loop + zdtun flow tracking (libcapture.so).
    externalNativeBuild {
        cmake {
            path file("src/main/c/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs 'src/main/jniLibs'
            }
        }
        test {
            // The native payload contract lives in one file that both the Rust
            // contract tests and StatusDecoderTest read.
            resources.srcDirs += 'testdata'
        }
    }

    // Rust decrypt/parse stack (libirminsul.so) built from this module's rust/.
    task buildRustLibs(type: Exec) {
        workingDir "${projectDir}/rust/irminsul-jni"
        // Declare inputs so Gradle re-runs cargo when sources change; without
        // this the task stays UP-TO-DATE forever once jniLibs exists.
        inputs.dir "${projectDir}/rust/irminsul-jni/src"
        inputs.file "${projectDir}/rust/irminsul-jni/Cargo.toml"
        inputs.file "${projectDir}/rust/irminsul-jni/Cargo.lock"
        inputs.dir "${projectDir}/rust/irminsul-core/src"
        inputs.file "${projectDir}/rust/irminsul-core/Cargo.toml"
        inputs.file "${projectDir}/rust/irminsul-core/build.rs"
        // Respect the inherited PATH (e.g. injected by `mise exec` or a
        // cargo-ndk shim) and only fall back to ~/.cargo/bin as a safety net,
        // so mise-managed toolchains take priority over a local ~/.cargo.
        def cargoDir = "${System.getenv('HOME')}/.cargo/bin"
        def basePath = System.getenv('PATH') ?: ''
        def newPath = basePath.contains(cargoDir) ? basePath : "${basePath}:${cargoDir}"
        environment 'PATH', newPath
        // NOTE: whitespace separated, no quoting support (values must not contain spaces)
        def extraArgs = (System.getenv('CARGO_EXTRA_ARGS') ?: '')
                .trim().split("\\s+").findAll { it }
        // Gradle's Exec resolves the executable against the daemon's PATH, not
        // the child environment set below — use the absolute path when present.
        def homeCargo = "${System.getenv('HOME')}/.cargo/bin/cargo"
        def cargoExe = file(homeCargo).exists() ? homeCargo : 'cargo'
        commandLine cargoExe, 'ndk',
                '-t', 'arm64-v8a',
                '-o', "${projectDir}/src/main/jniLibs",
                'build',
                '--release',
                '--lib',
                *extraArgs

        // Declare the produced native libs so Gradle treats src/main/jniLibs as
        // a real task output. Without this, AGP's merge/package tasks cache the
        // previously packaged .so and never refresh the APK when buildRustLibs
        // rewrites it.
        outputs.dir "${projectDir}/src/main/jniLibs"
    }

    preBuild.dependsOn buildRustLibs
}

// The shipped native libraries are part of this module's interface: Kotlin
// declares each `external fun` by package + class name while C and Rust export
// it by literal name, so a one-sided rename compiles, links, and then fails at
// runtime with UnsatisfiedLinkError.
//
// The expected names are DERIVED from the Kotlin sources rather than copied
// into a list here: a copied list can only check that the native side kept up,
// which is half the failure. The one hand-written fact left is which library
// serves which class — one entry per class, not per symbol.
def jniLibraryFor = [NativeLib: 'libirminsul.so', CaptureService: 'libcapture.so']
def jniLibraries = jniLibraryFor.values().toList().unique()

def declaredJniSymbols = { ->
    def found = [:].withDefault { [] as TreeSet }
    fileTree(dir: "${projectDir}/src/main/java", include: '**/*.kt').each { File f ->
        def text = f.text
        def pkgMatcher = (text =~ /(?m)^package\s+([0-9a-zA-Z_.]+)/)
        if (!pkgMatcher.find()) return
        def pkg = pkgMatcher.group(1)
        def classMatcher = (text =~ /(?m)^(?:internal\s+|private\s+|public\s+)?(?:open\s+|abstract\s+)?(?:class|object)\s+([A-Za-z0-9_]+)/)
        def owner = null
        while (classMatcher.find()) {
            if (jniLibraryFor.containsKey(classMatcher.group(1))) owner = classMatcher.group(1)
        }
        if (owner == null) return
        def funMatcher = (text =~ /(?m)external\s+fun\s+([A-Za-z0-9_]+)/)
        while (funMatcher.find()) {
            found[jniLibraryFor[owner]] << "Java_${pkg.replace('.', '_')}_${owner}_${funMatcher.group(1)}"
        }
    }
    found
}

def nmHost = System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin-x86_64'
    : (System.getProperty('os.name').toLowerCase().contains('windows') ? 'windows-x86_64' : 'linux-x86_64')

tasks.register('verifyNativeSymbols') {
    group = 'verification'
    description = 'Checks that the JNI exports in the merged .so files are exactly the external funs Kotlin declares.'
    def merged = layout.buildDirectory.dir('intermediates/merged_native_libs/debug/out/lib/arm64-v8a')
    def nmTool = file("${android.ndkDirectory}/toolchains/llvm/prebuilt/${nmHost}/bin/llvm-nm")
    inputs.dir(merged)
    inputs.files(fileTree(dir: "${projectDir}/src/main/java", include: '**/*.kt'))
    doLast {
        def declared = declaredJniSymbols()
        def problems = []
        def total = 0

        jniLibraries.each { lib ->
            def so = new File(merged.get().asFile, lib)
            if (!so.exists()) {
                problems << "expected $lib in the merged native libs but it is absent"
                return
            }
            def out = providers.exec {
                commandLine nmTool.absolutePath, '-g', '--defined-only', so.absolutePath
            }.standardOutput.asText.get()
            def exported = (out =~ /(?m)^.*\b(Java_com_esc_irminsul\w+)/).collect { it[1] }.toSet()
            def expected = (declared[lib] ?: []).toSet()

            (expected - exported).each { problems << "$lib does not export $it (declared in Kotlin)" }
            (exported - expected).each { problems << "$lib exports $it but no Kotlin external fun declares it" }
            total += expected.size()
        }

        if (problems) {
            throw new GradleException(
                "Native symbol check failed — a Kotlin/native rename was not done in lockstep:\n  " +
                    problems.join("\n  ")
            )
        }
        logger.lifecycle("Native symbols verified: $total exports declared in Kotlin, found in ${jniLibraries.size()} libs")
    }
}

// Variant tasks are created after evaluation, so match by name instead of
// resolving them eagerly.
tasks.matching { it.name == 'assembleDebug' }.configureEach {
    finalizedBy 'verifyNativeSymbols'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests; the android.jar stubs throw "not mocked".
    testImplementation 'org.json:json:20240303'
}

// The other half of the payload contract: the native producer must keep
// emitting the keys capture/testdata/summary_status.json declares. Runs with
// `./gradlew :capture:check`, next to the Kotlin decoder test.
tasks.register('verifyNativePayloadContract', Exec) {
    group = 'verification'
    description = 'Runs the Rust contract tests that pin the JNI payload keys.'
    workingDir "${projectDir}/rust/irminsul-jni"
    def cargoDir = "${System.getenv('HOME')}/.cargo/bin"
    def basePath = System.getenv('PATH') ?: ''
    environment 'PATH', basePath.contains(cargoDir) ? basePath : "${basePath}:${cargoDir}"
    def homeCargo = "${cargoDir}/cargo"
    commandLine file(homeCargo).exists() ? homeCargo : 'cargo', 'test', 'contract_tests'
    inputs.dir "${projectDir}/rust/irminsul-jni/src"
    inputs.dir "${projectDir}/testdata"
}

tasks.matching { it.name == 'check' }.configureEach {
    dependsOn 'verifyNativePayloadContract'
}

// Publish as `com.esc.irminsul:capture:<version>`; `./gradlew :capture:publishToMavenLocal`
// (or :capture:publishReleasePublicationTo<repo>) produces an AAR that already
// carries both native libraries, the VPN service and the permissions.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.esc.irminsul'
                artifactId = 'capture'
                version = '1.4.0'
                pom {
                    name = 'Irminsul Capture'
                    description = 'Genshin packet capture, decryption and protobuf ' +
                            'command decoding as an embeddable Android library.'
                }
            }
        }
    }
}
