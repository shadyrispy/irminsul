[package]
name = "irminsul-jni"
version = "1.2.0"
edition = "2024"
publish = false

[lib]
# Produces libirminsul.so, which is what NativeLib.kt loads.
name = "irminsul"
path = "src/lib.rs"
crate-type = ["cdylib"]

# Everything that decodes lives in irminsul-decode, so the Android bridge and the
# desktop viewer cannot drift apart.
[dependencies]
irminsul-decode = { path = "../irminsul-decode" }
jni = "0.21"
serde_json = { version = "1.0.143", features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
