[package]
name = "pcap-check"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Same declaration as irminsul-jni; resolved to the shadyrispy fork by the
# [patch] table in the repo-level .cargo/config.toml.
auto-artifactarium = { git = "https://github.com/konkers/auto-artifactarium", rev = "4ba25fac64b88970143af6bc2a2ef51338e620d0" }
anyhow = "1.0.99"
base64 = "0.22.1"
serde_json = { version = "1", features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
