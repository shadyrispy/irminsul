pluginManagement {
    repositories {
        // Mirror first: dl.google.com is unreachable from some networks
        // (mainland China); the mirror serves the same artifacts.
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Lets :capture-sample consume the locally published :capture AAR
        // (./gradlew :capture:publishToMavenLocal) instead of the project.
        mavenLocal()
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}

rootProject.name = "IrminsulAndroid"
include ':app'
include ':capture'
include ':capture-sample'
