name: Android

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "27.0.12077973"
  RUST_TARGET: aarch64-linux-android
  # The only ABI the library ships today: `ndk.abiFilters` and `cargo ndk -t` both
  # name it. A host on another ABI cannot install the AAR until that changes.
  ABI: arm64-v8a

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: debug
            gradle_task: assembleDebug :capture:check
            artifact_name: irminsul-debug.apk
            apk_path: app/build/outputs/apk/debug/app-debug.apk
          - build_type: release
            gradle_task: assembleRelease
            artifact_name: irminsul-release.apk
            apk_path: app/build/outputs/apk/release/app-release.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
      - run: rustup target add ${{ env.RUST_TARGET }}
      - run: cargo install cargo-ndk
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            capture/rust/irminsul-core/target
            capture/rust/irminsul-jni/target
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: android-${{ matrix.build_type }}-${{ hashFiles('**/Cargo.lock', 'app/*.gradle*', 'capture/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
      - if: matrix.build_type == 'release'
        name: Decode keystore
        working-directory: app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew ${{ matrix.gradle_task }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.apk_path }}

  # The AAR is a shipped artifact, not a build intermediate. This job publishes it to
  # a local Maven repo and builds the sample against *that* — the only claim the
  # sample's dependency on `com.esc.irminsul:capture` makes is that a host needs
  # nothing but the published library, and a source-project shortcut would let that
  # claim rot unnoticed.
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
      - run: rustup target add ${{ env.RUST_TARGET }}
      - run: cargo install cargo-ndk
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            capture/rust/irminsul-core/target
            capture/rust/irminsul-jni/target
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: android-library-${{ hashFiles('**/Cargo.lock', 'capture/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Check, build and publish the library
        run: ./gradlew :capture:check :capture:assembleRelease :capture:publishToMavenLocal
      - name: Insist the AAR carries both native libraries
        run: |
          unzip -l capture/build/outputs/aar/capture-release.aar > /tmp/aar.txt
          for so in libirminsul.so libcapture.so; do
            grep -q "jni/${{ env.ABI }}/$so" /tmp/aar.txt || {
              echo "capture-release.aar has no $so — a host would install and fail at runtime"; exit 1; }
          done
      - name: Build the sample against the published AAR
        run: ./gradlew :capture-sample:assembleDebug
      - name: Stage the Maven repo for upload
        run: |
          mkdir -p artifact && cp -r ~/.m2/repository/com/esc/irminsul artifact/maven-local-com.esc.irminsul
      - name: Upload the AAR and its Maven coordinates
        uses: actions/upload-artifact@v4
        with:
          name: capture-aar
          path: |
            capture/build/outputs/aar/capture-release.aar
            artifact/maven-local-com.esc.irminsul
